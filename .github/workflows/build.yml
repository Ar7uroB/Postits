name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Abrir el proyecto
        run: |
          mkdir proyecto
          unzip -oq "$(ls *.zip | head -n 1)" -d proyecto
          ls proyecto

      - name: Compilar
        working-directory: proyecto
        run: gradle assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: postits-apk
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
